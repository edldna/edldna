# Arquivo de configuração do Alembic para SuperGuard
# Documentação: https://alembic.sqlalchemy.org/

[alembic]
# URL do banco é sobrescrita pelo env.py via DATABASE_URL
script_location = alembic

# Formato do timestamp nos arquivos de migração
file_template = %%(rev)s_%%(slug)s

# Codificação dos arquivos de migração
prepend_sys_path = .

# Habilita a geração automática de IDs únicos
revision_environment = false

# Template para novos arquivos de migração
# sourceless = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
