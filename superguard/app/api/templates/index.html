<!DOCTYPE html>
<html lang="en">
<head>

    <title>Superguard - Análise de Câmeras</title>
    <style>
        body { font-family: sans-serif; }
        .container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Superguard - Análise de Câmeras</h1>
    <div class="container">
        <div class="camera">
            <h2>Câmera 1</h2>
            <img src="placeholder.jpg" alt="Câmera 1" width="100%">
        </div>
        <div class="camera">
            <h2>Câmera 2</h2>
            <img src="placeholder.jpg" alt="Câmera 2" width="100%">
        </div>
        <div class="camera">
            <h2>Câmera 3</h2>
            <img src="placeholder.jpg" alt="Câmera 3" width="100%">
        </div>
        <div class="camera">
            <h2>Câmera 4</h2>
            <img src="placeholder.jpg" alt="Câmera 4" width="100%">
        </div>
        <div class="analysis">
            <h2>Análise da Ferramenta 1</h2>
            <p>Resultados da análise em tempo real...</p>
        </div>
        <div class="analysis">
            <h2>Análise da Ferramenta 2</h2>
            <p>Resultados da análise em tempo real...</p>
        </div>
    </div>
</body>
</html>
